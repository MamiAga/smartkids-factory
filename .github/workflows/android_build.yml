name: Android Control Center build check

# Compiles the app + runs JVM unit tests on every push that touches the app.
# No secrets are used and no APK is published (a public-repo artifact would leak BuildConfig keys).

on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android_build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create throwaway debug keystore (debug.keystore is git-ignored)
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: JVM unit tests
        run: gradle :app:testDebugUnitTest
