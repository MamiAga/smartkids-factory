name: SmartKids Cloud Autonomous Factory

# ONE production entry point for both paths:
#   * hourly cron   -> plan decides (enabled? schedule_time reached? daily target left? channel connected?)
#   * Android START -> workflow_dispatch run_now=true (skips only the schedule_time wait)
# Narration runs on several runners at the same time (factory_core.yml), then one runner per video renders.

on:
  schedule:
    - cron: '17 * * * *'   # off the :00 peak, GitHub drops/delays many :00 schedules
  workflow_dispatch:
    inputs:
      run_now:
        description: 'Ignore schedule_time and produce now (Android START)'
        type: boolean
        default: false
      force_run:
        description: 'Maintenance: run even if automation_control.enabled = false'
        type: boolean
        default: false

concurrency:
  group: smartkids-cloud-factory
  cancel-in-progress: false

jobs:
  factory:
    uses: ./.github/workflows/factory_core.yml
    with:
      run_now: ${{ inputs.run_now == true }}
      force: ${{ inputs.force_run == true }}
    secrets: inherit
