name: SmartKids Production Pipeline (ARM64 Ubuntu 24.04)

# Manual single-job tool (debug / re-test one episode+language).
# Daily autonomous production runs through smartkids_factory.yml, NOT this file.
# Idempotent: if the job already has a YouTube video, the upload is skipped (no duplicate).

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID from backend/engine/longform.py'
        required: true
        default: 'EP-COLORS-MEGA-V1'
      language:
        description: 'Target language (EN)'
        required: true
        default: 'EN'
      dry_run:
        description: 'Render + QA only (no YouTube upload, no Supabase write)'
        type: boolean
        default: false
      tts_engine:
        description: 'Narrator engine'
        type: choice
        options: [kokoro, chatterbox]
        default: kokoro
      publish:
        description: 'Privacy after processing + SKQS-3 gate'
        type: choice
        options: [PRIVATE, UNLISTED, PUBLIC]
        default: PRIVATE

concurrency:
  group: smartkids-cloud-factory   # never run in parallel with the autonomous factory
  cancel-in-progress: false

jobs:
  produce_and_verify:
    runs-on: ubuntu-24.04-arm
    name: Production Pipeline Runner (ubuntu-24.04-arm)
    timeout-minutes: 120
    env:
      ALLOW_PAID_SERVICES: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Runner diagnostics
        run: uname -a && python3 --version && free -h && df -h /

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install FFmpeg, fonts, Pillow, Kokoro TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji
          pip install -q pillow==12.* numpy soundfile kokoro-onnx==0.6.1

      - name: Install Piper TTS (architecture-aware)
        run: |
          ARCH=$(uname -m)
          TAR_FILE=$([ "$ARCH" = "aarch64" ] && echo piper_linux_aarch64.tar.gz || echo piper_linux_x86_64.tar.gz)
          mkdir -p /tmp/piper_install
          curl -fsSL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/$TAR_FILE" | tar -xz -C /tmp/piper_install
          sudo cp -r /tmp/piper_install/piper/* /usr/local/bin/

      - name: Unit tests
        run: python3 -m unittest discover -s backend/tests -v

      - name: Install Chatterbox (only when selected)
        if: inputs.tts_engine == 'chatterbox'
        run: |
          python3 -m venv /tmp/cbenv
          /tmp/cbenv/bin/pip install -q --upgrade pip
          /tmp/cbenv/bin/pip install -q chatterbox-tts==0.1.7

      - name: Download Kokoro narrator model
        run: python3 backend/tools/download_models.py --kokoro

      - name: Run production job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          SMARTKIDS_TTS_ENGINE: ${{ inputs.tts_engine }}
          CHATTERBOX_PY: /tmp/cbenv/bin/python
        run: |
          FLAGS="--strict-supabase --publish ${{ inputs.publish }}"
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="--dry-run"
          python3 backend/engine/production_runner.py \
            --episode "${{ inputs.episode_id }}" --language "${{ inputs.language }}" $FLAGS

      - name: Verify Supabase record
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EPISODE_ID: ${{ inputs.episode_id }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from backend.engine.production_runner import make_job_id
          from backend.engine.supabase_rest import SupabaseREST
          job_id, _ = make_job_id(os.environ["EPISODE_ID"], os.environ["LANGUAGE"].upper())
          rec = SupabaseREST().get_job(job_id)
          if not rec:
              sys.exit(f"SUPABASE CHECK FAILED: {job_id} not found")
          for k in ("job_id", "state", "youtube_video_id", "processing_status", "youtube_privacy_status", "updated_at"):
              print(f"  {k}: {rec.get(k)}")
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-audit-${{ github.run_id }}
          path: |
            /tmp/smartkids_output/*.json
            /tmp/smartkids_output/*.mp4
            /tmp/smartkids_output/*.jpg
          if-no-files-found: ignore
          retention-days: 7
