name: SmartKids Production Pipeline (manual test run)

# Manual run of one episode in chosen languages, same parallel pipeline as the autonomous factory.
# Idempotent: a language that already has a YouTube video for this episode is not uploaded again.

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode (EP-COLORS-MEGA-V1, EP-ANIMALS-MEGA-V1)'
        required: true
        default: 'EP-ANIMALS-MEGA-V1'
      languages:
        description: 'Languages, space separated (EN ES PT FR DE IT TR RU AR HI)'
        required: true
        default: 'EN'
      mode:
        description: 'Distribution'
        type: choice
        options: [MULTI_CHANNEL, SINGLE_CHANNEL, SINGLE_CHANNEL_MULTI_AUDIO]
        default: MULTI_CHANNEL
      narrator:
        description: 'Narrator (alternate = girl/boy per episode)'
        type: choice
        options: [alternate, female, male]
        default: alternate
      shards:
        description: 'Parallel narration runners per language'
        type: number
        default: 8
      dry_run:
        description: 'Render + QA only (no YouTube upload, no Supabase write)'
        type: boolean
        default: false
      publish:
        description: 'Privacy after processing + quality gate'
        type: choice
        options: [PRIVATE, UNLISTED, PUBLIC]
        default: PRIVATE

concurrency:
  group: smartkids-cloud-factory   # never run in parallel with the autonomous factory
  cancel-in-progress: false

jobs:
  factory:
    uses: ./.github/workflows/factory_core.yml
    with:
      force: true
      episode: ${{ inputs.episode_id }}
      languages: ${{ inputs.languages }}
      mode: ${{ inputs.mode }}
      narrator: ${{ inputs.narrator == 'alternate' && '' || inputs.narrator }}
      shards: ${{ fromJSON(format('{0}', inputs.shards)) }}
      dry_run: ${{ inputs.dry_run }}
      publish: ${{ inputs.publish }}
    secrets: inherit
